server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fonts/images rarely change and are safe to cache long-term.
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # main.dart.js and friends keep the same filename across every deploy
    # (Flutter web doesn't content-hash them here), so a long max-age would
    # let browsers keep serving a stale build indefinitely. Force revalidation
    # on every load instead — cheap 304s when unchanged, fresh content when not.
    location ~* \.(?:js|json|wasm)$ {
        add_header Cache-Control "no-cache";
    }
}
