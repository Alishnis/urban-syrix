name: Deploy backend to Hugging Face Space

# Free hosting for the FastAPI backend. Skips cleanly (no red CI) until the
# repo variable HF_SPACE_ID is set; see docs/DEPLOY.md for the one-time setup.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "modules/**"
      - "scripts/stage_hf_space.py"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Sync to Space
    if: vars.HF_SPACE_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stage Space folder
        run: python3 scripts/stage_hf_space.py "$RUNNER_TEMP/hf_space"

      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          STAGE_DIR: ${{ runner.temp }}/hf_space
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret HF_TOKEN is not set (HF_SPACE_ID is). See docs/DEPLOY.md."
            exit 1
          fi
          pip install --quiet huggingface_hub
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE_ID"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path=os.environ["STAGE_DIR"],
              # drop files removed from backend/ or modules/, keep Space-managed files
              delete_patterns=["backend/*", "modules/*"],
              commit_message=f"Deploy {os.environ.get('GITHUB_SHA', 'manual')[:7]} from GitHub",
          )
          print(f"Uploaded to https://huggingface.co/spaces/{space}")
          PY
