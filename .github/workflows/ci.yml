name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same as backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      # Light install: the tests stub `ultralytics` and never load model weights.
      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest
